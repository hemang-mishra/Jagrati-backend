jwt.secret=${JWT_SECRET_BASE_64}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jagrati}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
# Recreate db on startup (for dev mode)
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.format_sql = true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public

server.port=8080

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_ID}
spring.mail.password=${GMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application Configuration
# Note: Client secret is not required for Android OAuth2
#app.base-url=http://localhost:8080
app.base-url=${BASE_URL:http://localhost:8080}
app.name=Jagrati

# Google-login (Android Client ID for token verification)
spring.security.oauth2.client.registration.google.client-id=${OAUTH2_CLIENT_ID:your-google-client-id-here}

# application.properties
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Super Admin Configuration
app.super-admin.email=${ADMIN_MAIL}
app.super-admin.password=${ADMIN_PASS}
app.super-admin.first-name=Jagrati
app.super-admin.last-name=Admin
app.super-admin.pid=JAGRATI_ADMIN

#Image kit
imagekit.private-key=${IMAGE_KIT_PRIVATE_KEY}

# Institute identity
# The local part of an address on this domain is the person's roll number, which is
# what makes roll numbers verified rather than self-asserted. Accounts listed in
# allowed-non-institute-emails bypass the domain rule (the seeded super admin has no
# college address); they get no roll number and cannot become volunteers.
app.institute.email-domain=${INSTITUTE_EMAIL_DOMAIN:iiitdmj.ac.in}
app.institute.enforce-email-domain=${INSTITUTE_ENFORCE_EMAIL_DOMAIN:true}
app.institute.allowed-non-institute-emails=${INSTITUTE_ALLOWED_EMAILS:${ADMIN_MAIL}}
